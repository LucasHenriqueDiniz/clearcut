name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tauri:
    name: Tauri build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # AppImage bundling: linuxdeploy fails on the 24.04 image that
          # ubuntu-latest now points at, and building on the older glibc also
          # makes the AppImage run on more distros.
          - ubuntu-22.04
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            desktop-file-utils

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install backend deps
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build backend sidecar
        run: python scripts/build-backend-sidecar.py

      - name: Verify backend sidecar
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            test -f src-tauri/resources/backend/ipu-backend/ipu-backend.exe
          else
            test -f src-tauri/resources/backend/ipu-backend/ipu-backend
          fi

      # linuxdeploy writes its diagnostics to stderr and the bundler only
      # forwards them with --verbose. Without it the failure is 27 seconds of
      # silence followed by "failed to run linuxdeploy".
      - name: Build Tauri app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          RUST_BACKTRACE: "1"
        run: npm run tauri:build -- --verbose
        working-directory: frontend

      # linuxdeploy leaves the half-built AppDir behind. What it does and does
      # not contain is the other half of the diagnosis.
      - name: Dump AppImage build tree on failure
        if: failure() && matrix.platform == 'ubuntu-22.04'
        run: |
          appdir=src-tauri/target/release/bundle/appimage
          echo "--- tree ---"
          find "$appdir" -maxdepth 3 2>/dev/null | head -60 || echo "no appimage dir"
          echo "--- biggest files ---"
          du -ah "$appdir" 2>/dev/null | sort -rh | head -20
          echo "--- disk ---"
          df -h /

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run tauri:build
        working-directory: frontend

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
